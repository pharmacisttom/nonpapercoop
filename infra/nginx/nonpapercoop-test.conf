# TEMPLATE ONLY: substitute a verified new TEST hostname and certificate paths.
server {
  listen 443 ssl;
  server_name nonpapercoop-test.example.invalid;
  ssl_certificate /etc/nonpapercoop-test/tls/fullchain.pem;
  ssl_certificate_key /etc/nonpapercoop-test/tls/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 11m;
  client_body_timeout 30s;
  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}

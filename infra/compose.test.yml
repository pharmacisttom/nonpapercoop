name: nonpapercoop-test
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: nonpapercoop_test
      MYSQL_USER: nonpapercoop_test
      MYSQL_PASSWORD: ${TEST_DB_PASSWORD:?Provide new TEST password}
      MYSQL_ROOT_PASSWORD: ${TEST_DB_ROOT_PASSWORD:?Provide different TEST root password}
    ports:
      - "127.0.0.1:33306:3306"
    volumes:
      - nonpapercoop_test_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --user=$$MYSQL_USER --database=nonpapercoop_test --execute='SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [isolated]
networks:
  isolated:
    internal: true
volumes:
  nonpapercoop_test_mysql:

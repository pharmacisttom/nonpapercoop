name: TEST quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: nonpapercoop_test
          MYSQL_USER: nonpapercoop_test
          MYSQL_PASSWORD: ci_disposable_fixture_app
          MYSQL_ROOT_PASSWORD: ci_disposable_fixture_root
          MYSQL_ROOT_HOST: '%'
        ports:
          - 33307:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: test
      APP_ORIGIN: http://127.0.0.1:3199
      COOKIE_SECURE: 'false'
      GOOGLE_CLIENT_ID: test.apps.googleusercontent.com
      SESSION_SECRET: ci-disposable-fixture-session-secret-never-use-on-deployed-system
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '33307'
      MYSQL_DATABASE: nonpapercoop_test
      MYSQL_USER: nonpapercoop_test
      MYSQL_PASSWORD: ci_disposable_fixture_app
      MYSQL_ROOT_PASSWORD: ci_disposable_fixture_root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: node scripts/ci-migrate.mjs
      - run: node --test --test-concurrency=1 tests/enterprise/*.test.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PW_CHANNEL: chromium
      - run: npm run test:e2e
        env:
          PW_CHANNEL: chromium
          E2E_ENTERPRISE: 'true'
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: artifacts/
